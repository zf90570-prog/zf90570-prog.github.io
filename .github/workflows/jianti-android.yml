name: JianTi Final Android Release
on:
  push:
    branches: [jianti-final-3]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release
        run: gradle --no-daemon assembleRelease
      - name: Zipalign
        run: $ANDROID_HOME/build-tools/35.0.0/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/jianti-final-aligned.apk
      - name: Publish unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JianTiFinal-Unsigned
          path: app/build/outputs/apk/release/jianti-final-aligned.apk
