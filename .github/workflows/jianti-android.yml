name: JianTi 4.1 Offline OCR Repair
on:
  push:
    branches: [jianti-v41-swim-ocr-fix]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand 4.0 original project and apply 4.1 fixes
        run: |
          base64 -d v4_payload.b64 > v4_source.zip
          unzip -oq v4_source.zip
          cp overrides/MainActivity.java app/src/main/java/com/fencing/athletic/MainActivity.java
          cp overrides/v4.js app/src/main/assets/v4.js
          sed -i "s/versionCode 400/versionCode 410/;s/versionName '4.0.0'/versionName '4.1.0'/" app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify scripts
        run: node --check app/src/main/assets/v4.js
      - name: Build 4.1 unsigned release
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: JianTi-v41-Unsigned-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
